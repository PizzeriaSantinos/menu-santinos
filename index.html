    * {
      box-sizing: border-box;
    }

    html {
      background-color: #000000;
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Garamont', serif;
      background-color: transparent;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo original al 100%, sin desenfoque ni marca de agua */
    .bg-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }

    header, section, .footer {
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 3.5em 0.5em 1.5em 0.5em;
      max-width: 900px;
      margin: auto;
      border-bottom: 2px solid rgba(255, 255, 255, 0.25);
      transition: opacity 0.4s ease;
    }

    /* Logo en blanco totalmente limpio, ocupando casi todo el ancho */
    .logo {
      width: 94%;
      max-width: 600px;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: url(#logo-transparente);
    }

    .lang-buttons {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .lang-buttons button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      font-family: 'Garamont', serif;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .lang-buttons button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffffff;
    }

    section {
      max-width: 900px;
      margin: auto;
      padding: 1em 1.5em;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Títulos de secciones con Pearlington */
    h2 {
      font-family: 'Pearlington', cursive;
      font-weight: normal;
      font-size: 2.3em;
      line-height: 1.25;
      letter-spacing: 0;
      color: #ffffff;
      border-bottom: 2px solid rgba(255, 255, 255, 0.35);
      padding-bottom: 0.25em;
      padding-left: 0.15em;
      margin-top: 0.8em;
      text-transform: none;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      transition: opacity 0.4s ease;
    }

    .item {
      margin: 1.2em 0 2.2em 0;
      font-size: 1.05em;
      font-family: 'Garamont', serif;
      line-height: 1.5;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
      transition: opacity 0.4s ease;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 0.25em;
    }

    /* Títulos de las pizzas con AmericanCaptain */
    .item strong {
      font-family: 'AmericanCaptain', sans-serif;
      font-weight: normal;
      font-size: 1.55em;
      line-height: 1.3;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* Precios de las pizzas con AmericanCaptain */
    .price {
      font-family: 'AmericanCaptain', sans-serif;
      font-weight: normal;
      font-size: 1.45em;
      line-height: 1.3;
      color: #ffffff;
      white-space: nowrap;
    }

    .desc {
      color: #f0f0f0;
      font-size: 1.25rem;
      margin-bottom: 0.4em;
    }

    .item.bebidas-list {
      font-size: 1.25rem;
    }

    .alergenos img, .alergenos-list img {
      width: 20px;
      height: 20px;
      margin-right: 6px;
      vertical-align: middle;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 2px;
      border-radius: 50%;
    }

    .footer {
      text-align: center;
      padding: 2em 1em;
      font-size: 1.15rem;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Garamont', serif;
      margin-top: 2em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    #alergenos .item.alergenos-list {
      margin: 0.5em 0;
      font-size: 1.25rem;
      line-height: 1.6;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 600px) {
      header {
        padding: 4em 0.4em 1.2em 0.4em;
      }
      .logo {
        width: 96%;
        max-width: none;
      }
      h2 {
        font-size: 2em;
      }
      .item strong {
        font-size: 1.4em;
      }
      .price {
        font-size: 1.35em;
      }
      .bebidas-list {
        column-count: 3;
        column-gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

function initScrollAnimations() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
      } else {
        entry.target.classList.remove("visible");
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll("section").forEach(sec => {
    observer.observe(sec);
  });
}

          </div>
          <div class="desc">${p.desc}</div>
          <span class="alergenos">${p.alerg.map(a=>`<img src="${a}" alt="Alérgeno">`).join('')}</span>
        </div>`;
    });

    // Bebidas
    document.getElementById("bebidas").innerHTML = `<h2>${t.bebidasTitle}</h2>
      <div class="item bebidas-list">
        ${t.bebidas.map(b => `<div>${b}</div>`).join('')}
      </div>`;

    // Alérgenos
    const al = document.getElementById("alergenos");
    al.innerHTML = `<h2>${t.alergenosTitle}</h2>`;
    t.alergenos.forEach(a => {
      al.innerHTML += `<div class="item alergenos-list"><img src="${a[0]}" alt="${a[1]}"> ${a[1]}</div>`;
    });

    sections.forEach(sec => sec.style.opacity = "1");

    initScrollAnimations();
  }, 400);
}

setLang('es');
initScrollAnimations();
</script>
</body>
</html>
